name: Deploy a stack over SSH
description: >-
  Copy deploy/docker-compose.yml to one environment on the server and bring it
  up on the images already published. One implementation, used by both the dev
  and prod jobs — the two differ only in which directory they land in.

inputs:
  environment:
    description: 'prod or dev — the directory under /srv/worldzero'
    required: true
  host:
    description: Server IPv4
    required: true
  ssh-key:
    description: Private key for the deploy user
    required: true
  known-hosts:
    description: Pinned host key (ssh-keyscan output)
    required: true
  backup-label:
    description: >-
      If set, `backup.sh <environment> <label>` runs before the pull, while the
      old backend still owns the database: start.sh migrates on boot and no
      migration has a downgrade. A label that already has a dump is kept, so a
      re-run never overwrites the pre-migration copy with a migrated one.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      env:
        BACKUP_LABEL: ${{ inputs.backup-label }}
        ENVIRONMENT: ${{ inputs.environment }}
        SSH_HOST: ${{ inputs.host }}
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Pinned host key, not StrictHostKeyChecking=no — without the pin, the
        # first thing that answers on that IP is handed a session that runs
        # Docker as root.
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

        # The label lands in a remote shell line, so it may only be a tag name.
        [[ $BACKUP_LABEL =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad backup label '$BACKUP_LABEL'"; exit 1; }
        backup=:
        if [ -n "$BACKUP_LABEL" ]; then
          db="/srv/backups/$ENVIRONMENT-db-$BACKUP_LABEL.dump"
          media="/srv/backups/$ENVIRONMENT-media-$BACKUP_LABEL.tgz"
          # Exit non-zero with both files written means only the off-box push
          # failed (backup-red reports it); the local pair is enough to deploy.
          # Never rotated: README §8 says to prune old pre-v* by hand.
          # The explicit exit: set -e ignores a failure inside an && group.
          # A db-only dump leaves $media.skipped so a re-run (backend now up,
          # db migrated) keeps it instead of dumping over it.
          # A stopped stack (prod-reset's down -v, a recovery deploy) has no
          # database to dump, so it deploys without one and says so.
          backup="if docker compose ps --status running -q db | grep -q .; then if [ -s $db ] && { [ -s $media ] || [ -e $media.skipped ]; }; then echo \"keeping existing pre-$BACKUP_LABEL dump from \$(stat -c %y $db)\" >&2; else /srv/worldzero/backup.sh $ENVIRONMENT $BACKUP_LABEL || { [ -s $db ] && [ -s $media ]; } || { [ -s $db ] && ! docker compose ps --status running -q backend | grep -q . && touch $media.skipped && echo 'backend not running; db-only pre-deploy dump' >&2; } || { echo 'pre-deploy backup failed; not deploying' >&2; exit 1; }; fi; else echo 'db not running; no pre-deploy backup' >&2; fi"
        fi

        scp deploy/docker-compose.yml \
            "deploy@$SSH_HOST:/srv/worldzero/$ENVIRONMENT/docker-compose.yml"

        # `up -d`, not `down && up`: compose recreates only what changed, so
        # Postgres never bounces and the API is down for a second or two rather
        # than for the length of a database start.
        #
        # The .env on the box is what names the image tag; CI never writes it,
        # so no application secret passes through GitHub.
        ssh "deploy@$SSH_HOST" "
          set -e
          cd /srv/worldzero/$ENVIRONMENT
          $backup
          # Prune first: a full disk fails the pull, and a prune after it
          # never runs. Rollback pulls its tag from the registry (README §9).
          docker image prune -af
          docker compose pull
          docker compose up -d
        "
